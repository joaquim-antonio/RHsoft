openapi: 3.0.3
info:
  title: RHSoft API
  description: API para o sistema de Recursos Humanos (RHSoft)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Servidor local de desenvolvimento

paths:
  /funcionarios:
    post:
      summary: Cadastrar funcionário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: string
                cargo:
                  type: string
                salario:
                  type: number
      responses:
        '201':
          description: Funcionário cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  mensagem:
                    type: string
    get:
      summary: Listar funcionários
      responses:
        '200':
          description: Lista de funcionários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcionario'

  /funcionarios/{id}:
    get:
      summary: Consultar funcionário por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do funcionário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'

components:
  schemas:
    Funcionario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cpf:
          type: string
        cargo:
          type: string
        salario:
          type: number
