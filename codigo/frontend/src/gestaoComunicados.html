<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Gestão de Comunicados</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/pages/gestaoComunicados.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/global/logo.png"/>
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid p-0" style="height: calc(100vh - 97px); overflow: hidden;">
        <div class="row h-100 g-0">
            <div id="sidebarAdministradorContainer" class="col-md-3 col-lg-2 d-none d-md-block h-100 border-end"></div>

            <div class="col-md-9 col-lg-10 h-100" style="overflow-y: scroll;">
                <div class="p-4">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold text-primary-custom mb-0">Gestão de Comunicados</h2>
                        <button class="btn btn-primary" onclick="abrirModal()">
                            <i class="fas fa-plus me-2"></i>Novo
                        </button>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0"
                                    placeholder="Buscar por título ou descrição..." id="inputBusca"
                                    onkeyup="filtrarLista()">
                            </div>
                        </div>

                        <div class="col-md-4 d-flex gap-2">
                            <div class="dropdown w-50">
                                <button
                                    class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center dropdown-toggle"
                                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-filter me-2"></i> <span id="textoFiltro">Todos</span>
                                </button>
                                <ul class="dropdown-menu w-100">
                                    <li><a class="dropdown-item" href="#" onclick="aplicarFiltro('TODOS')">Todos</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                            onclick="aplicarFiltro('IMPORTANTE')">Importante</a></li>
                                    <li><a class="dropdown-item" href="#"
                                            onclick="aplicarFiltro('INFORMATIVO')">Informativo</a></li>
                                    <li><a class="dropdown-item" href="#" onclick="aplicarFiltro('EVENTO')">Evento</a>
                                    </li>
                                </ul>
                            </div>

                            <button
                                class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center"
                                onclick="alternarOrdem()" id="btnData">
                                <i class="far fas fa-sort-amount-down me-2"></i> <span id="textoOrdem">Recentes</span>
                            </button>
                        </div>
                    </div>

                    <div id="listaComunicados" class="d-flex flex-column gap-3">
                        <div class="text-center py-5">
                            <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                        </div>
                    </div>

                    <nav aria-label="Navegação" class="d-flex justify-content-center mt-4">
                        <ul class="pagination justify-content-center" id="paginationControls">
                        </ul>
                    </nav>

                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalComunicado" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Novo Comunicado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formComunicado">
                        <input type="hidden" id="comunicadoId">

                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required
                                placeholder="Ex: Manutenção do Sistema">
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo de Aviso</label>
                            <select class="form-select" id="tipo" required>
                                <option value="INFORMATIVO">Informativo (Azul)</option>
                                <option value="IMPORTANTE">Importante (Vermelho)</option>
                                <option value="EVENTO">Evento (Amarelo)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Conteúdo</label>
                            <textarea class="form-control" id="descricao" rows="4" required
                                placeholder="Detalhes do aviso..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarComunicado()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>Excluir Comunicado
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">Tem certeza que deseja remover este comunicado?</p>
                    <p class="small text-muted mb-0">Esta ação é permanente e não pode ser desfeita.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" onclick="confirmarExclusao()">
                        <i class="fas fa-trash-alt me-2"></i>Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-medium">
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/global/setup.js"></script>
    <script src="assets/js/pages/gestaoComunicados.js"></script>
</body>

</html>
