<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Meu Perfil</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/global/cabecalho.css">
    <link rel="stylesheet" href="assets/css/global/aside.css">
    <link rel="stylesheet" href="assets/css/pages/perfilCandidato.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/global/logo.png" />
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid">
        <div class="row">
            <div id="sidebarCandidatoContainer" class="col-md-3 col-lg-2 ps-0 d-none d-md-block"></div>

            <div class="col-md-9 col-lg-10 main-content p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-primary-custom mb-1">
                            <i class="fas fa-user-circle me-2"></i>Meu Currículo
                        </h2>
                        <p class="text-muted mb-0">Mantenha seus dados atualizados para aumentar suas chances.</p>
                    </div>
                    <button class="btn btn-primary btn-save shadow-sm" id="btnSalvar">
                        <i class="fas fa-save me-2"></i>Salvar Alterações
                    </button>
                </div>

                <div id="loadingSpinner" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>

                <div id="profileContent" class="d-none">
                    
                    <!-- Dados Pessoais -->
                    <div class="card border-0 shadow-sm mb-4 rounded-4">
                        <div class="card-header bg-transparent border-0 pt-4 px-4">
                            <h5 class="fw-bold text-secondary mb-0"><i class="fas fa-id-card me-2"></i>Dados Pessoais</h5>
                        </div>
                        <div class="card-body px-4 pb-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Nome Completo</label>
                                    <input type="text" class="form-control bg-light" id="inputNome">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">CPF</label>
                                    <input type="text" class="form-control bg-light" id="inputCpf" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Contato</label>
                                    <input type="text" class="form-control bg-light" id="inputTelefone">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4">
                        
                        <div class="col-lg-6">          
                            <!-- Habilidades -->
                            <div class="card border-0 shadow-sm mb-4 rounded-4 h-100">
                                <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between">
                                    <h5 class="fw-bold text-primary-custom mb-0"><i class="fas fa-star me-2"></i>Habilidades</h5>
                                    <button class="btn btn-sm btn-light text-primary fw-bold" onclick="adicionarItem('listaHabilidades', 'habilidade')">
                                        <i class="fas fa-plus"></i> Adicionar
                                    </button>
                                </div>
                                <div class="card-body px-4">
                                    <div id="listaHabilidades" class="d-flex flex-column gap-2">
                                    </div>
                                    <p class="text-muted small mt-3 fst-italic">Ex: Java, Spring Boot, Inglês Avançado...</p>
                                </div>
                            </div>

                        </div>

                        <div class="col-lg-6">
                            <!-- Formação Acadêmica -->
                            <div class="card border-0 shadow-sm mb-4 rounded-4">
                                <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between">
                                    <h5 class="fw-bold text-primary-custom mb-0"><i class="fas fa-graduation-cap me-2"></i>Formação</h5>
                                    <button class="btn btn-sm btn-light text-primary fw-bold" onclick="adicionarItem('listaFormacao', 'formacao')">
                                        <i class="fas fa-plus"></i> Adicionar
                                    </button>
                                </div>
                                <div class="card-body px-4">
                                    <div id="listaFormacao" class="d-flex flex-column gap-2"></div>
                                </div>
                            </div>

                        </div>

                        <!-- Experiência Profissional -->
                        <div class="col-12">
                            <div class="card border-0 shadow-sm mb-4 rounded-4">
                                <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between">
                                    <h5 class="fw-bold text-primary-custom mb-0"><i class="fas fa-briefcase me-2"></i>Experiência Profissional</h5>
                                    <button class="btn btn-sm btn-light text-primary fw-bold" onclick="adicionarItem('listaExperiencias', 'experiencia', true)">
                                        <i class="fas fa-plus"></i> Adicionar
                                    </button>
                                </div>
                                <div class="card-body px-4">
                                    <div id="listaExperiencias" class="d-flex flex-column gap-3"></div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-semibold" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/global/setup.js"></script>
    <script src="assets/js/pages/perfilCandidato.js"></script>
</body>
</html>
