server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compressao ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml font/woff2;

    # --- Cabecalho de seguranca basico ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Cache de estaticos ---
    # O frontend nao tem pipeline de build com hash no nome do arquivo, entao
    # nao da para usar cache imutavel longo sem risco de servir versao velha.
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|eot|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # HTML nao deve ser cacheado: evita que uma pagina nova sirva markup antigo.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Imagens carregadas por scripts (ex.: CBO) devem ser servidas normalmente.
    location /assets/ {
        try_files $uri =404;
    }

    # --- Fallback SPA ---
    # As rotas do sistema sao paginas .html reais (ex.: login.html, vagas.html),
    # nao rotas de client-side routing. O fallback cobre apenas navegaao sem
    # extensao, evitando que /loginex404 retorne 200 com index.html silencioso.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Nada de listagem de diretorio nem de arquivos ocultos.
    autoindex off;
    location ~ /\. {
        deny all;
        return 404;
    }
}
