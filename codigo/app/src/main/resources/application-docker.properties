# Perfil Docker (uso com codigo/docker-compose.yml).
# Sobrescreve o H2 de development por MySQL 8 e desliga o Swagger UI.
#
# Ativado por SPRING_PROFILES_ACTIVE=docker no compose.

# --- MySQL 8 (servico `db`) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:rhsoft}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:rhsoft}
spring.datasource.password=${DB_PASSWORD:rhsoft}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Seguranca ---
# Sem fallback: em container a variavel de ambiente e obrigatoria.
api.security.token.secret=${JWT_SECRET}

# --- Documentacao da API ---
# Desligada no container para nao expor a superficie de discovery publicamente.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Log ---
logging.level.com.exemplo.app=INFO
