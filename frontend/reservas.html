<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Minhas Reservas</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">

    <link rel="stylesheet" href="assets/css/pages/reservas.css">
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid">
        <div class="row">

            <div id="sidebarPlaceHolder" class="col-md-3 col-lg-2 ps-0"></div>

            <div class="col-md-9 col-lg-10 main-content p-4">

                <h2 class="mb-4">Minhas Reservas</h2>

                <div class="row">
                    <div class="col-12">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Lista de Reservas</h5>
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Recurso</th>
                                                <th>Data Início</th>
                                                <th>Data Fim</th>
                                                <th>Status</th>
                                                <th>Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody id="reservasTableBody">
                                            <!-- As reservas mockadas serão inseridas aqui pelo JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                                <p id="noReservasMessage" class="text-center text-muted d-none">Nenhuma reserva encontrada.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="./assets/js/global/setup.js"></script>
    <script src="assets/js/pages/reservas.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

</body>

</html>
