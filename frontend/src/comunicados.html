<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Mural de Comunicados</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/pages/portalFuncionario.css">
    <link rel="stylesheet" href="assets/css/pages/comunicados.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/global/logo.png" />

</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid p-0" style="height: calc(100vh - 97px); overflow: hidden;">
        <div class="row h-100 g-0">
            <div id="sidebarCandidatoContainer" class="col-md-3 col-lg-2 d-none d-md-block h-100 border-end"></div>

            <div class="col-md-9 col-lg-10 h-100" style="overflow-y: scroll; background-color: var(--conteudo);">
                <div class="p-4">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-primary-custom mb-1">
                                <i class="fas fa-bullhorn me-2"></i>Mural de Avisos
                            </h2>
                            <p class="text-muted mb-0">Fique por dentro das novidades da empresa.</p>
                        </div>
                    </div>

                    <div class="mb-4">
                        <span class="badge bg-danger-subtle border border-danger-subtle me-2 text-danger">Importante</span>
                        <span class="badge bg-primary-subtle border border-primary-subtle me-2 text-primary">Informativo</span>
                        <span class="badge bg-warning-subtle border border-warning-subtle text-warning">Eventos</span>
                    </div>

                    <div id="containerComunicados" class="row g-4 mb-5">
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                        </div>
                    </div>

                    <nav aria-label="Navegação de páginas">
                        <ul class="pagination justify-content-center" id="paginationControls">
                            </ul>
                    </nav>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/global/setup.js"></script>
    <script src="assets/js/pages/todosComunicados.js"></script>
</body>
</html>
