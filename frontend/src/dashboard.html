<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Dashboard</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">

    <link rel="stylesheet" href="assets/css/pages/dashboard.css">
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid">
        <div class="row">

            <div id="sidebarPlaceHolder" class="col-md-3 col-lg-2 ps-0"></div>

            <div class="col-md-9 col-lg-10 main-content p-4">

                <div class="row gy-4 mb-4">

                    <div class="col-lg-3 col-md-6">
                        <h5 class="chart-title mb-3">Distribuição</h5>
                        <div class="chart-wrapper">
                            <div class="chart-center-text">
                                <div class="display-4 fw-bold">50</div>
                                <div class="text-muted">Funcionários</div>
                            </div>
                            <canvas id="funcionariosChart"></canvas>
                        </div>
                    </div>

                    <div class="col-lg-5 col-md-6">

                        <div class="row">

                            <div class="col-6">
                                <h5 class="chart-title mb-3">Contratações Recentes</h5>
                                <div class="widget-card mb-3">Neymar Junior <span
                                        class="float-end text-muted">1705</span></div>
                                <div class="widget-card mb-3">Neymar Junior <span
                                        class="float-end text-muted">1705</span></div>
                            </div>

                            <div class="col-6">
                                <h5 class="chart-title mb-3">Desativações Recentes</h5>
                                <div class="widget-card mb-3">Neymar Junior <span
                                        class="float-end text-muted">1705</span></div>
                                <div class="widget-card mb-3">Neymar Junior <span
                                        class="float-end text-muted">1705</span></div>
                            </div>

                        </div>
                    </div>

                    <div class="col-lg-4 col-md-12">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="chart-title mb-0">Próximas Reuniões</h5>
                        </div>
                        <div class="row">
                            <div class="col-lg-6 col-md-3 col-6 mb-3">
                                <div class="widget-card agenda">
                                    <div class="text-muted small">14:00-15:00</div>
                                    <div class="fw-bold">Topic</div>
                                    <div>Entrevista</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row gy-4">
                        <div class="col-lg-6">
                            <h5 class="chart-title mb-3">Horas extras</h5>
                            <div class="chart-container" style="height: 350px;">
                                <canvas id="departamentosChart"></canvas>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <h5 class="chart-title mb-3">Despesas</h5>
                            <div class="chart-container" style="height: 350px;">
                                <canvas id="balancoChart"></canvas>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <script src="./assets/js/global/setup.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="assets/js/pages/dashboard.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

</body>

</html>
