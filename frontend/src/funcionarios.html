<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHsoft - Gestão de Funcionários</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/global/reset.css">
    <link rel="stylesheet" href="assets/css/global/variables.css">
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/pages/funcionarios/funcionarios.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/global/logo.png" />
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid p-0" style="height: calc(100vh - 97px); overflow: hidden;">
        <div class="row h-100 g-0">
            <div id="sidebarPlaceHolder" class="col-md-3 col-lg-2 d-none d-md-block h-100 border-end"></div>

            <main class="col-md-9 col-lg-10 h-100 main-content" style="overflow-y: scroll;">
                <div class="p-4">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-dark mb-1">Colaboradores</h2>
                            <p class="text-muted small">Gerencie o quadro de funcionários da empresa.</p>
                        </div>
                        <button class="btn btn-primary d-flex align-items-center gap-2 shadow-sm" onclick="openAddModal()">
                            <i class="fa-solid fa-user-plus"></i> Novo Funcionário
                        </button>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-3">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                                        <input type="text" id="search" class="form-control border-start-0 ps-0" placeholder="Buscar por nome, CPF ou cargo...">
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="filtro-departamento">
                                        <option value="">Todos Departamentos</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="filtro-status">
                                        <option value="">Todos Status</option>
                                        <option value="ATIVO">Ativo</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0" id="func-table">
                                    <thead class="bg-light">
                                        <tr>
                                            <th class="ps-4">Colaborador</th>
                                            <th>Cargo / Depto</th>
                                            <th>Contato</th>
                                            <th>Status</th>
                                            <th class="text-end pe-4">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="func-list">
                                        </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalFuncionario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="modalTitle">
                        <i class="fa-solid fa-user-pen me-2"></i>Dados do Funcionário
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formFuncionario">
                        <input type="hidden" id="edit-mode" value="false">
                        
                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-header bg-white fw-bold text-primary">
                                <i class="fa-regular fa-id-card me-2"></i>Dados Pessoais
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">CPF</label>
                                        <input type="text" id="inp-cpf" class="form-control" placeholder="000.000.000-00">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Nome</label>
                                        <input type="text" id="inp-nome" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Sobrenome</label>
                                        <input type="text" id="inp-sobrenome" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Data Nascimento</label>
                                        <input type="date" id="inp-nascimento" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Gênero</label>
                                        <select id="inp-genero" class="form-select">
                                            <option value="MASCULINO">Masculino</option>
                                            <option value="FEMININO">Feminino</option>
                                            <option value="OUTRO">Outro</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4" id="div-senha">
                                        <label class="form-label small text-muted fw-bold text-danger">Senha Inicial</label>
                                        <input type="password" id="inp-password" class="form-control" placeholder="Apenas p/ novos">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-header bg-white fw-bold text-primary">
                                <i class="fa-solid fa-briefcase me-2"></i>Dados Contratuais
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Cargo (ID)</label>
                                        <input type="number" id="inp-cargo" class="form-control" placeholder="Ex: 1">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Departamento (ID)</label>
                                        <input type="number" id="inp-departamento" class="form-control" placeholder="Ex: 2">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Data Admissão</label>
                                        <input type="date" id="inp-admissao" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Salário Base (R$)</label>
                                        <input type="number" id="inp-salario" class="form-control" step="0.01">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Horas Mensais</label>
                                        <input type="number" id="inp-horas" class="form-control" value="220">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Adicional</label>
                                        <select id="inp-acrescimo" class="form-select">
                                            <option value="NENHUM">Nenhum</option>
                                            <option value="INSALUBRIDADE">Insalubridade</option>
                                            <option value="PERICULOSIDADE">Periculosidade</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-header fw-bold text-primary">
                                <i class="fa-solid fa-map-location-dot me-2"></i>Endereço e Contato
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Telefone</label>
                                        <input type="text" id="inp-telefone" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small text-muted">CEP</label>
                                        <input type="text" id="inp-cep" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label small text-muted">Logradouro</label>
                                        <input type="text" id="inp-rua" class="form-control">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label small text-muted">Número</label>
                                        <input type="text" id="inp-numero" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Bairro</label>
                                        <input type="text" id="inp-bairro" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Cidade</label>
                                        <input type="text" id="inp-cidade" class="form-control">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label small text-muted">UF</label>
                                        <input type="text" id="inp-estado" class="form-control" maxlength="2">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white fw-bold text-primary">
                                <i class="fa-solid fa-building-columns me-2"></i>Dados Bancários
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Banco</label>
                                        <input type="text" id="inp-banco" class="form-control" placeholder="Ex: Nubank">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label small text-muted">Agência</label>
                                        <input type="text" id="inp-agencia" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small text-muted">Conta</label>
                                        <input type="text" id="inp-conta" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small text-muted">Chave PIX</label>
                                        <input type="text" id="inp-pix" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer bg-white border-top-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary px-4" onclick="salvarFuncionario()">
                        <i class="fa-solid fa-check me-2"></i>Salvar Dados
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/global/setup.js"></script>
    <script src="assets/js/pages/funcionarios/funcionarios.js"></script>
</body>
</html>
