<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/pages/vagas/vagas.css">
    <title>Document</title>
</head>

<body>
    <!--cabecalho-->
    <header class="cabecalho" id="cabecalho">
        <h1 class="cabecalho_titulo"><a href="index.html">RHsoft</a></h1>
        <div class="profile">
            <a href="login.html" class="profile">
                <span>Perfil</span>
                <i class="profile-icon fa-solid fa-circle-user fa-2x"></i>
            </a>
        </div>
    </header>
    <!--div para flexbox-->
    <div class="content">
        <!--barra lateral-->
        <aside class="aside">
            <nav>
                <h3 class="aside_titles">Geral</h3>
                <ul>
                    <li class="aside_items"><a href="funcionarios.html"><i
                                class="aside_icons fa-solid fa-user-tie"></i>Funcionarios</a></li>
                    <li class="aside_items"><a href="contracheque.html"><i
                                class="aside_icons fa-solid fa-money-check-dollar"></i>Contracheque</a></li>
                    <li class="aside_items"><a href="vagas.html"><i
                                class="aside_icons fa-solid fa-receipt"></i>Vagas</a></li>
                    <li class="aside_items"><a href="folhaPagamento.html"><i
                                class="aside_icons fa-solid fa-suitcase"></i>Folha de
                            Pagamento</a></li>
                </ul>
            </nav>
            <section>
                <h3>Suporte</h3>
                <ul>
                    <li class="aside_items"><a href="#"><i class="aside_icons fa-solid fa-circle-info"></i>Ajuda</a>
                    </li>
                    <li class="aside_items"><a href="#"><i class="aside_icons fa-solid fa-gear"></i>Configurações</a>
                    </li>
                </ul>
            </section>
            <div class="aside_themes">
                <i class="aside_icons aside_items fa-solid fa-moon"></i>
                <i class="aside_icons aside_items fa-solid fa-sun"></i>
            </div>
        </aside>
        <!--conteúdo-->
        <main>
            <h2>Vagas</h2>
            <section class="main_top">
                <div class="search-box">
                    <i class="aside_items fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search" placeholder="Pesquisar funcionário...">
                </div>
                <button class="btn" id="adicionar_vagas"><i class="fa-solid fa-square-plus fa-2x"></i></button>
            </section>
            <section class="main_cards">
                <div class="vagasContainer" id="vagasContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>
                <div id="emptyState" class="empty-state d-none">
                    <i class="fas fa-inbox"></i>
                    <h3>Nenhuma vaga encontrada</h3>
                    <p>Tente ajustar seus filtros de busca</p>
                </div>
            </section>
        </main>
    </div>

    <!--MODAL-->
    <div id="vagaModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Criar Nova Vaga</h3>
            <form id="vagaForm">
                <label for="vaga-titulo">Título da Vaga:</label>
                <input type="text" id="vaga-titulo" name="titulo" required>

                <label for="vaga-funcao">Função:</label>
                <input type="text" id="vaga-funcao" name="funcao" required>

                <label for="vaga-descricao">Descrição:</label>
                <textarea id="vaga-descricao" name="descricao" rows="4" required></textarea>

                <label for="vaga-dataLimite">Data Limite:</label>
                <input type="date" id="vaga-dataLimite" name="dataLimite" required>

                <label for="vaga-cargoId">ID do Cargo:</label>
                <input type="number" id="vaga-cargoId" name="cargoId" required>

                <label for="vaga-departamentoId">ID do Departamento:</label>
                <input type="number" id="vaga-departamentoId" name="departamentoId" required>

                <div class="modal-actions">
                    <button type="submit" class="submit-btn">Salvar Vaga</button>
                    <button type="button" class="cancel-btn" id="closeModal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="assets/js/pages/vagas/vagas.js"></script>
</body>

</html>
