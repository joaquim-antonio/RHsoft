<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Gestão da folha</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/pages/folhaPagamento/folhaPagamento.css">
    <link rel="icon" type="image/x-icon" href="assets/images/global/logo.png">
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid p-0" style="height: calc(100vh -97px); overflow: hidden;">
        <div class="row h-100 g-0">
            <div id="sidebarAdmnistradorContainer" class="col-md-3 col-lg-2 d-none d-md-block h-100 border-end"></div>

            <div class="col-md-9 col-lg-10 h-100 p-4" style="overflow-y: scroll;">
                <div class="p-4">
                    <div>
                        <h2 class="fw-bold text-primary-custom mb-1">
                            <i class="fa-solid fa-money-bill-wave me-2"></i>
                            Gestão da Folha de Pagamento
                        </h2>
                    </div>

                    <div class="d-flex gap-2">
                        <button id="btnAbrirFolha" class="btn btn-outline-primary d-none">
                            <i class="fas fa-plus me-2"></i>
                        </button><button id="btnGerarCalculosFolha" class="btn btn-outline-primary d-none">
                            <i class="fas fa-calculator me-2"></i>
                        </button>
                        <button id="btnFecharFolha" class="btn btn-outline-primary d-none">
                            <i class="fas fa-check-circle me-2"></i>
                        </button>
                        <button id="btnReabrirFolha" class="btn btn-outline-primary d-none">
                            <i class="fas fa-undo me-2"></i>
                        </button>
                    </div>
                </div>

                <div class="row mb-4" id="cardsResumo">
                    <div class="col-md-4">
                        <div class="card shadow-sm card-resumo p-3">
                            <h6 class="text-muted">Total funcionários</h6>
                            <h3 class="fw-bold" id="totalFuncionarios">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm card-resumo p-3">
                            <h6 class="text-muted">Status Atual</h6>
                            <h3 class="fw-bold" id="statusFolha">---</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm card-resumo p-3">
                            <h6 class="text-muted">Total Líquido da Folha</h6>
                            <h3 class="fw-bold" id="totalLiquido">R$ 0,00</h3>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Funcionário</th>
                                        <th>Cargo</th>
                                        <th>Salário Base</th>
                                        <th>Adicionais</th>
                                        <th>Descontos</th>
                                        <th>Líquido</th>
                                        <th class="text-end pe-4">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaPagamentos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade", id="modalEditarPagamento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajuste Manual</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEdicao">
                        <input type="hidden" id="editCodigoPagamento">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Funcionário</label>
                            <input type="text" class="form-control" id="editNomeFuncionario" disabled>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Horas Extras (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="editarHorasExtras">
                                <div class="form-text">Valor monetário total das HE.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Bônus/Adicional Manual</label>
                                <input type="number" step="0.01" class="form-control" id="editarAdicionarManual">
                            </div>
                        </div>
                        <div class="alert alert-info small">
                            <i class="fas fa-into-circle me-1"></i>
                            O sistema recalcularar INSS E FGTS automaticamente
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="model">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarEdicaoPagamento()">Salvar e recalcular</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/global/setup.js"></script>
    <script src="assets/js/pages/folhaPagamento.js"></script>
</body>

</html>
