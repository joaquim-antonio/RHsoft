<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHSoft - Portal do Funcionario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global/setup.css">
    <link rel="stylesheet" href="assets/css/global/cabecalho.css">
    <link rel="stylesheet" href="assets/css/global/aside.css">
    <link rel="stylesheet" href="assets/css/pages/portalFuncionario.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/global/logo.png" />
</head>

<body>
    <header id="headerPlaceHolder"></header>

    <div class="container-fluid">
        <div class="row">

            <div id="sidebarFuncionarioContainer" class="col-md-3 col-lg-2 ps-0 d-none d-md-block"></div>

            <!-- Conteúdo Principal -->
            <div class="col-md-9 col-lg-10 main-content p-4" style="overflow-y: scroll;">
                <div class="p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold text-primary-custom mb-1">
                                <i class="fas fa-user-tie me-2"></i>Olá, <span id="nomeFuncionario"></span>
                            </h2>
                            <p class="text-muted" id="cargoDepartamento">...</p>
                        </div>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card shadow-sm card-highlight p-3">
                                <div class="d-flex justify-content-between align-content-start">
                                    <div>
                                        <h6 class="text-muted text-uppercase small fw-bold">Último Salário Líquido</h6>
                                        <h2 class="fw-bold text-success mb-0" id="ultimoSalario">R$ 0,00</h2>
                                        <small class="text-muted" id="dataReferencia">---/---</small>
                                    </div>
                                    <div class="icon-shape text-primary rounded-circle p-3">
                                        <i class="fas fa-wallet fa-lg"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 col-lg-4">
                            <div class="card shadow-sm p-3 h-100 cursor-pointer" onclick="windown.location.href='#'">
                                <div class="d-flex align-items-center h-100">
                                    <div class="icon-shape text-info rounded-circle p-3 me-3">
                                        <i class="fas fa-user-edit fa-lg"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-1">Meus Dados</h6>
                                        <small class="text-muted">Atualizar dados</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm mb-4">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/global/setup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/pages/portalFuncionario.js"></script>

</body>

</html>
