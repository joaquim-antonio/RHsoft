<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHsoft - home</title>
    <link rel="stylesheet" href="assets/css/pages/index/index.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!--cabecalho-->
    <header class="cabecalho" id="cabecalho">
        <h1 class="cabecalho_titulo"><a href="index.html">RHsoft</a></h1>
        <div class="profile">
            <a href="login.html" class="profile">
                <span>Perfil</span>
                <i class="profile-icon fa-solid fa-circle-user fa-2x"></i>

            </a>
        </div>
    </header>
    <!--div pra flexbox-->
    <div class="content">
        <!--barra lateral-->
        <aside class="aside">
            <nav>
                <h3 class="aside_titles">Geral</h3>
                <ul>
                    <li class="aside_items"><a href="funcionarios.html"><i
                                class="aside_icons fa-solid fa-user-tie"></i>Funcionarios</a></li>
                    <li class="aside_items"><a href="contracheque.html"><i
                                class="aside_icons fa-solid fa-money-check-dollar"></i>Contracheque</a></li>
                    <li class="aside_items"><a href="vagas.html"><i
                                class="aside_icons fa-solid fa-receipt"></i>Vagas</a></li>
                    <li class="aside_items"><a href="#"><i class="aside_icons fa-solid fa-suitcase"></i>Folha de
                            Pagamento</a></li>
                </ul>
            </nav>
            <section>
                <h3>Suporte</h3>
                <ul>
                    <li class="aside_items"><a href="#"><i class="aside_icons fa-solid fa-circle-info"></i>Ajuda</a>
                    </li>
                    <li class="aside_items"><a href="#"><i class="aside_icons fa-solid fa-gear"></i>Configurações</a>
                    </li>


                </ul>
            </section>
            <div class="aside_themes">
                <i class="aside_icons aside_items fa-solid fa-moon"></i>
                <i class="aside_icons aside_items fa-solid fa-sun"></i>
            </div>
        </aside>
        <!--dashboards-->
        <main>
            dashboards em cards criados dinamicamente com js usando de chart.js
            exemplo:<br><br>
            <div class="card">
                <h3>Número de vendas (mensal)</h3>
                <canvas id="meuGrafico"></canvas>
            </div>
        </main>
    </div>
    <script>
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        const meuGrafico = new Chart(ctx, {
            type: 'bar', // tipos: bar, line, pie, doughnut, radar, polarArea
            data: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
                datasets: [{
                    label: 'Vendas (R$)',
                    data: [1200, 1900, 3000, 2500, 2200, 3200],
                    backgroundColor: 'rgba(75, 192, 192, 0.5)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>

</html>
